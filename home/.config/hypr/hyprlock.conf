$font = Adwaita Sans
$fg   = rgba(250, 250, 251, 1.0)

general {
    hide_cursor = true
    ignore_empty_input = true
    fail_timeout = 3000
}

animations {
    enabled = true
    bezier = easeOut, 0.22, 1, 0.36, 1
    animation = fadeIn, 1, 3, easeOut
    animation = fadeOut, 1, 3, easeOut
    animation = inputFieldFade, 1, 2, easeOut
    animation = inputFieldDots, 1, 1, easeOut
}

background {
    monitor =
    path = ~/Pictures/wallpapers/wallpaper.png
    color = rgba(34, 34, 38, 1.0)

    blur_passes = 2
    blur_size = 4
    brightness = 0.85
    contrast = 0.95
    vibrancy = 0.17
    vibrancy_darkness = 0.05
    noise = 0.0117
}

label {
    monitor =
    text = <span weight="ultrabold" font_features="tnum">$TIME</span>
    color = $fg
    font_size = 96
    font_family = $font

    shadow_passes = 3
    shadow_size = 5
    shadow_color = rgba(0, 0, 0, 0.6)
    shadow_boost = 1.2

    position = 0, 58
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:30000] date +'%A %B %-d'
    color = $fg
    font_size = 27
    font_family = $font

    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgba(0, 0, 0, 0.6)

    position = 0, -45
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 400, 42
    rounding = 12
    outline_thickness = 2
    inner_color = rgba(250, 250, 251, 0.12)
    outer_color = rgba(250, 250, 251, 0.4)
    font_color = $fg
    font_family = $font

    dots_size = 0.18
    dots_spacing = 0.35
    dots_center = true

    fade_on_empty = true
    fade_timeout = 3000

    placeholder_text = <span size="x-large" alpha="70%">Password</span>
    fail_text = <span size="x-large"></span>
    check_color = rgba(250, 250, 251, 0.7)
    fail_color = rgba(237, 51, 59, 1.0)
    capslock_color = rgba(245, 194, 17, 1.0)

    position = 0, -180
    halign = center
    valign = center
}
