set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
run -b '~/.config/tmux/plugins/tpm/tpm'

set-environment -g TMUX_FZF_PREVIEW 0
set-environment -g TMUX_FZF_OPTIONS '-p -w 62% -h 38% -m --margin=0 --padding=0,1'
set-environment -g TMUX_FZF_PANE_FORMAT '#{pane_current_command}  #{b:pane_current_path}'
set-environment -g TMUX_FZF_WINDOW_FORMAT '#{window_name}  #{window_panes} pane#{?#{==:#{window_panes},1},,s}'
set-environment -g TMUX_FZF_SESSION_FORMAT '#{session_windows} window#{?#{==:#{session_windows},1},,s}#{?session_attached,  attached,}'

set -g default-terminal "tmux-256color"
set -as terminal-overrides ",*:Tc"
set -as terminal-overrides ",*:RGB"

set -g mouse on
set -g history-limit 100000

set-option -g default-command "bash -i"

set-option -g pane-border-lines        single
set-option -g pane-border-style        fg='#2a2827'
set-option -g pane-active-border-style fg='#4a4746'

set-option -g mode-style                     "bg=#3e3b3c,fg=#c8c8d5"
set-option -g copy-mode-mark-style           "bg=#32302f"
set-option -g copy-mode-match-style          "bg=#6b7570,fg=#c8c8d5"
set-option -g copy-mode-current-match-style  "bg=#c8c8d5,fg=#1f1f1f"
set-option -g message-style                  "bg=#32302f,fg=#c8c8d5"
set-option -g message-command-style          "bg=#32302f,fg=#95a99f"

set-option -g status          on
set-option -g status-position bottom
set-option -g status-justify  left
set-option -g status-interval 5
set-option -gu status-bg
set-option -gu status-fg
set-option -g status-style    "bg=default,fg=#6b7570"

set-option -g status-left-length  60
set-option -g status-right-length 60

set-option -g status-left '#[fg=#1f1f1f]#[bg=default]#[bg=#1f1f1f]#[fg=#96a6c8]#[bold] #S#[nobold]'

set-option -g window-status-format '#[bg=#1f1f1f]#[fg=#6b7570]  #W#{?loop_last_flag, #[fg=#1f1f1f]#[bg=default],}'
set-option -g window-status-current-format '#[bg=#1f1f1f]  #[fg=#282828]#[bg=#1f1f1f]#[bg=#282828]#[fg=#c8c8d5] #W #[fg=#282828]#[bg=#1f1f1f]#{?loop_last_flag,#[fg=#1f1f1f]#[bg=default],}'
set-option -g window-status-separator ''
set-option -g window-status-activity-style 'fg=#e8bf66'
set-option -g window-status-bell-style     'fg=#e8bf66,bold'

set-option -g status-right '#[fg=#1f1f1f]#[bg=default]#[bg=#1f1f1f]#{?client_prefix, #[fg=#e8bf66],} #[fg=#c8c8d5]%H:%M  %d %b #[fg=#1f1f1f]#[bg=default]'

unbind C-b
set-option -g prefix C-f
bind C-f send-prefix

bind -n C-x switch-client -T C-x

bind -T C-x C-h switch-client -T C-x-C-h
bind -T C-x-C-h l run-shell -b "~/.config/tmux/switch.sh pane"
bind -T C-x-C-h d kill-pane -a
bind -T C-x-C-h c kill-pane
bind -T C-x-C-h s split-window -h -c "#{pane_current_path}" -b
bind -T C-x-C-h t split-window -v -c "#{pane_current_path}" -b
bind -T C-x-C-h w resize-pane -Z

bind -T C-x C-e switch-client -T C-x-C-e
bind -T C-x-C-e l run-shell -b "~/.config/tmux/switch.sh window"
bind -T C-x-C-e d kill-window -a
bind -T C-x-C-e c kill-window
bind -T C-x-C-e r command-prompt "rename-window %%"
bind -T C-x-C-e t new-window

bind -T C-x C-s switch-client -T C-x-C-s
bind -T C-x-C-s o run-shell -b "~/.config/tmux/plugins/tmux-fzf/scripts/session.sh"
bind -T C-x-C-s a run-shell "emacsclient -e '(adh-tmux-to-emacs-buffer)'"
bind -T C-x-C-s e run-shell "emacsclient -e '(adh-tmux-to-emacs-buffer-all)'"
bind -T C-x-C-s k detach

bind -T C-x o run-shell -b "emacsclient -e '(adh-tmux-cd \"#{pane_id}\")' >/dev/null 2>&1"

bind -n C-s copy-mode
bind -n C-a send-keys Down
bind -n C-e send-keys Up
bind -n C-o send-keys "cdi" Enter
bind -n C-d select-pane -t :.+

bind -n M-e select-window -t :-
bind -n M-a select-window -t :+
bind -n M-n copy-mode \; send-keys -X begin-selection
bind -n M-x run-shell -b "~/.config/tmux/plugins/tmux-fzf/main.sh"

bind -T copy-mode l send-keys -X copy-selection-and-cancel
bind -T copy-mode d send-keys -X previous-word
bind -T copy-mode c send-keys -X next-word-end
bind -T copy-mode n send-keys -X begin-selection \; send-keys X
bind -T copy-mode r send-keys -X begin-selection \; send-keys M-x
bind -T copy-mode v send-keys -X begin-selection \; send-keys -X rectangle-toggle \; send-keys X
bind -T copy-mode j send-keys -X start-of-line
bind -T copy-mode f send-keys -X back-to-indentation
bind -T copy-mode o send-keys -X end-of-line
bind -T copy-mode h send-keys -X cursor-left
bind -T copy-mode a send-keys -X cursor-down
bind -T copy-mode e send-keys -X cursor-up
bind -T copy-mode i send-keys -X cursor-right
bind -T copy-mode k send-keys -X select-line \; send-keys X
bind -T copy-mode p send-keys -X select-word
bind -T copy-mode > send-keys -X previous-space
bind -T copy-mode < send-keys -X next-space
bind -T copy-mode + send-keys -X top-line
bind -T copy-mode - send-keys -X bottom-line
bind -T copy-mode "." send-keys -X previous-paragraph
bind -T copy-mode "," send-keys -X next-paragraph
bind -T copy-mode ) send-keys -X halfpage-up
bind -T copy-mode ( send-keys -X halfpage-down
