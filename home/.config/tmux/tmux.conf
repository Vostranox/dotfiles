# Basic settings
set -g default-terminal "tmux-256color"
set -as terminal-overrides ",*:Tc"
set -as terminal-overrides ",*:RGB"

set -g mouse on
set -g history-limit 100000
set -g base-index 1
set-window-option -g pane-base-index 1

if-shell 'command -v fish >/dev/null 2>&1' 'set-option -g default-command "fish -i"' 'set-option -g default-command "bash -i"'
set-window-option -g mode-keys emacs
set-option -g status-keys emacs

# Appearance
set-option -g pane-border-lines        single
set-option -g pane-border-style        fg='#2a2827'
set-option -g pane-active-border-style fg='#4a4746'

set-option -g mode-style                     "bg=#3e3b3c,fg=#c8c8d5"
set-option -g copy-mode-mark-style           "bg=#32302f"
set-option -g copy-mode-match-style          "bg=#6b7570,fg=#c8c8d5"
set-option -g copy-mode-current-match-style  "bg=#c8c8d5,fg=#1f1f1f"
set-option -g message-style                  "bg=#282828,fg=#c8c8d5,fill=#282828"
set-option -g message-command-style          "bg=#282828,fg=#95a99f,fill=#282828"

# Status bar
set-option -g status          on
set-option -g status-position bottom
set-option -g status-justify  left
set-option -g status-interval 5
set-option -gu status-bg
set-option -gu status-fg
set-option -g status-style    "bg=default,fg=#6b7570"

set-option -g status-left-length  60
set-option -g status-right-length 60

set-option -g status-left '#[fg=#1f1f1f]#[bg=default]#[bg=#1f1f1f]#[fg=#96a6c8]#[bold] #S#[nobold]'

set-option -g window-status-format '#[bg=#1f1f1f]#[fg=#6b7570]  #W#{?loop_last_flag, #[fg=#1f1f1f]#[bg=default],}'
set-option -g window-status-current-format '#[bg=#1f1f1f]  #[fg=#282828]#[bg=#1f1f1f]#[bg=#282828]#[fg=#c8c8d5] #W #[fg=#282828]#[bg=#1f1f1f]#{?loop_last_flag,#[fg=#1f1f1f]#[bg=default],}'
set-option -g window-status-separator ''
set-option -g window-status-activity-style 'fg=#e8bf66'
set-option -g window-status-bell-style     'fg=#e8bf66,bold'

set-option -g status-right '#[fg=#1f1f1f]#[bg=default]#[bg=#1f1f1f]#{?#{||:#{==:#{pane_mode},copy-mode},#{||:#{client_prefix},#{m:adh-*,#{client_key_table}}}}, #[fg=#96a6c8]#{?#{==:#{client_key_table},adh-passthrough},tmux off,tmux} ,} #[fg=#c8c8d5]%H:%M  %d %b #[fg=#1f1f1f]#[bg=default]'

# Native picker settings
set-option -g tree-mode-preview-style        "fg=#95a99f"
set-option -g tree-mode-preview-format       '#{?pane_format,#{pane_index}: #{pane_current_command},#{window_index}: #{window_name}}'

set -g @adh-tree-session-format '#[fg=#96a6c8]#{session_windows} window#{?#{==:#{session_windows},1},,s}#[fg=#8a8a95]#{?session_attached,  · attached,}'
set -g @adh-tree-window-format '#[fg=#c8c8d5]#{p-24:#{=/23/…:window_name}}#[fg=#8a8a95]  #{window_panes} pane#{?#{==:#{window_panes},1},,s}#[fg=#95a99f]  #{window_flags}'
set -g @adh-tree-pane-format '#[fg=#95a99f]#{p-18:#{=/17/…:pane_current_command}}#[fg=#8a8a95]  #{b:pane_current_path}#[fg=#96a6c8]  #{pane_flags}'

# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'kristijan/fzf-pane-switch.tmux'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Plugin settings
set-environment -g TMUX_FZF_PREVIEW 0
set-environment -g TMUX_FZF_OPTIONS '-p -w 62% -h 38% -m --margin=0 --padding=0,1'
set-environment -g TMUX_FZF_PANE_FORMAT '#{pane_current_command}  #{b:pane_current_path}'
set-environment -g TMUX_FZF_WINDOW_FORMAT '#{window_name}  #{window_panes} pane#{?#{==:#{window_panes},1},,s}'
set-environment -g TMUX_FZF_SESSION_FORMAT '#{session_windows} window#{?#{==:#{session_windows},1},,s}#{?session_attached,  attached,}'

set -g @fzf_pane_switch_bind-key o
set -g @fzf_pane_switch_bind-key-mode prefix
set -g @fzf_pane_switch_layout tree
set -g @fzf_pane_switch_window-position 'center,70%,80%'
set -g @fzf_pane_switch_preview-pane true
set -g @fzf_pane_switch_preview-pane-start visible
set -g @fzf_pane_switch_preview-pane-position 'right,50%,nowrap'
set -g @fzf_pane_switch_footer true
set -g @fzf_pane_switch_jump-labels true
set -g @fzf_pane_switch_refresh true
set -g @fzf_pane_switch_tree-session-format 'session_name'
set -g @fzf_pane_switch_tree-window-format 'window_name'
set -g @fzf_pane_switch_tree-pane-format 'pane_title pane_current_command'
set -g @fzf_pane_switch_tree-session-colours ''
set -g @fzf_pane_switch_tree-window-colours ''
set -g @fzf_pane_switch_tree-pane-colours ''

if-shell -F '#{m:*--jump-labels=1234567890abcdefghijklmnopqrstuvwxyz*,#{FZF_DEFAULT_OPTS}}' '' 'set-environment -gF FZF_DEFAULT_OPTS "#{FZF_DEFAULT_OPTS} --jump-labels=1234567890abcdefghijklmnopqrstuvwxyz"'
if-shell -F '#{m:*fzf-pane-controls.sh*,#{FZF_DEFAULT_OPTS}}' '' 'set-environment -gF FZF_DEFAULT_OPTS "#{FZF_DEFAULT_OPTS} --bind=\"ctrl-o:transform(bash ~/.config/tmux/fzf-pane-controls.sh jump),load:transform(bash ~/.config/tmux/fzf-pane-controls.sh loaded)\""'
if-shell -F '#{m:*ctrl-a:down*,#{FZF_DEFAULT_OPTS}}' '' 'set-environment -gF FZF_DEFAULT_OPTS "#{FZF_DEFAULT_OPTS} --bind=ctrl-a:down,ctrl-e:up"'

# Plugin loading
if-shell 'test -x "$HOME/.config/tmux/plugins/tpm/tpm"' 'run-shell "~/.config/tmux/plugins/tpm/tpm"'

# Key bindings
set-option -g prefix M-m
bind M-m send-prefix
bind w choose-tree -Zw -F '#{?pane_format,#{E:@adh-tree-pane-format},#{?window_format,#{E:@adh-tree-window-format},#{E:@adh-tree-session-format}}}'

bind u run-shell -b "emacsclient -e '(adh-tmux-cd \"#{pane_id}\")' >/dev/null 2>&1"
bind C-d send-keys C-d
bind C-g switch-client -T root
bind C-t switch-client -T root

bind -n C-s copy-mode
bind -n C-a send-keys Down
bind -n C-e send-keys Up
bind -n C-d select-pane -t :.+
bind -n M-e select-window -t :-
bind -n M-a select-window -t :+
bind M-e send-keys M-e
bind M-a send-keys M-a

# Keybinding toggle
bind -n F12 copy-mode -q \; set-option prefix None \; set-option prefix2 None \; set-option key-table adh-passthrough \; display-message 'tmux keys off (F12 to restore)'
bind -T adh-passthrough F12 set-option -u prefix \; set-option -u prefix2 \; set-option -u key-table \; display-message 'tmux keys on'

# Pane bindings
bind h switch-client -T adh-pane
bind -T adh-pane l switch-client -T prefix \; send-keys -K f
bind -T adh-pane d kill-pane -a
bind -T adh-pane c kill-pane
bind -T adh-pane s split-window -h -c "#{pane_current_path}" -b
bind -T adh-pane t split-window -v -c "#{pane_current_path}" -b
bind -T adh-pane w resize-pane -Z
bind -T adh-pane n select-layout tiled
bind -T adh-pane r rotate-window
bind -T adh-pane Escape switch-client -T root
bind -T adh-pane C-g switch-client -T root
bind -T adh-pane C-t switch-client -T root

# Session bindings
bind a switch-client -T adh-session
bind -T adh-session t command-prompt -p 'New session name:' 'new-session -s "%%%"'
bind -T adh-session c kill-session
bind -T adh-session d confirm-before -p 'Kill all other sessions? (y/n)' 'kill-session -a'
bind -T adh-session l command-prompt -T target -p 'Kill session name:' 'kill-session -t "%%%"'
bind -T adh-session r command-prompt -I '#S' -p 'Rename session:' 'rename-session "%%%"'
bind -T adh-session k detach
bind -T adh-session Escape switch-client -T root
bind -T adh-session C-g switch-client -T root
bind -T adh-session C-t switch-client -T root
bind -T adh-session a run-shell "emacsclient -u -e '(adh-tmux-to-emacs-buffer \"#{pane_id}\")' && tmux display-message 'Exported to Emacs'"
bind -T adh-session e run-shell "emacsclient -u -e '(adh-tmux-to-emacs-buffer-all \"#{pane_id}\")' && tmux display-message 'Exported to Emacs'"

# Window bindings
bind e switch-client -T adh-window
bind -T adh-window d kill-window -a
bind -T adh-window c kill-window
bind -T adh-window r command-prompt -l -I '#W' -p 'Rename window:' 'rename-window "%%%"'
bind -T adh-window t new-window -c "#{pane_current_path}"
bind -T adh-window Escape switch-client -T root
bind -T adh-window C-g switch-client -T root
bind -T adh-window C-t switch-client -T root

# Copy mode bindings
bind Escape copy-mode
bind p copy-mode \; send-keys -X rectangle-off \; send-keys -X select-word
bind k copy-mode \; send-keys -X rectangle-off \; send-keys -X select-line
bind n copy-mode \; send-keys -X rectangle-off \; send-keys -X begin-selection
bind v copy-mode \; send-keys -X begin-selection \; send-keys -X rectangle-on

bind -T copy-mode C-d select-pane -t :.+
bind -T copy-mode M-e select-window -t :-
bind -T copy-mode M-a select-window -t :+
bind -T copy-mode l send-keys -X copy-selection-and-cancel
bind -T copy-mode C-l send-keys -X copy-selection-and-cancel
bind -T copy-mode d send-keys -X previous-word
bind -T copy-mode c send-keys -X next-word-end
bind -T copy-mode n send-keys -X rectangle-off \; send-keys -X begin-selection
bind -T copy-mode r send-keys -X other-end
bind -T copy-mode v if-shell -F '#{selection_present}' 'send-keys -X rectangle-toggle' 'send-keys -X begin-selection; send-keys -X rectangle-on'
bind -T copy-mode j send-keys -X start-of-line
bind -T copy-mode f send-keys -X back-to-indentation
bind -T copy-mode o send-keys -X end-of-line
bind -T copy-mode h send-keys -X cursor-left
bind -T copy-mode a send-keys -X cursor-down
bind -T copy-mode e send-keys -X cursor-up
bind -T copy-mode i send-keys -X cursor-right
bind -T copy-mode C-a send-keys -X cursor-down
bind -T copy-mode C-e send-keys -X cursor-up
bind -T copy-mode k send-keys -X rectangle-off \; send-keys -X select-line
bind -T copy-mode p send-keys -X rectangle-off \; send-keys -X select-word
bind -T copy-mode C-h send-keys -X rectangle-off \; send-keys -X select-word
bind -T copy-mode > send-keys -X previous-space
bind -T copy-mode < send-keys -X next-space
bind -T copy-mode + send-keys -X history-top
bind -T copy-mode - send-keys -X history-bottom
bind -T copy-mode "." send-keys -X previous-paragraph
bind -T copy-mode "," send-keys -X next-paragraph
bind -T copy-mode ) send-keys -X halfpage-up
bind -T copy-mode ( send-keys -X halfpage-down
bind -T copy-mode t send-keys -X cancel
bind -T copy-mode Escape send-keys -X cancel
bind -T copy-mode C-g send-keys -X cancel
bind -T copy-mode C-t send-keys -X cancel
